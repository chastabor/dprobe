# Copy to dprobe.yaml (git-ignored) or ~/.config/dprobe/config.yaml.
# A plaintext password is allowed; ${VAR} reads one from the environment instead.
# dprobe.override.yaml beside it, if present, is merged over this file: a good
# place for passwords (e.g. connections: {hr-prod: {password: ...}}).

defaults:
  format: table        # table, csv, tsv, json, jsonl
  max_rows: 1000       # row limit for table output

connections:
  hr-prod:
    driver: oracle
    # Passed to oracledb as the dsn: Easy Connect, a tnsnames.ora alias, or a descriptor.
    url: db1.example.edu:1521/ORCLPDB1
    user: hr_ro
    password: ${HR_PROD_PASS}      # ${VAR} is read from the environment when used
    readonly: true

  sis:
    driver: mssql
    # host[:port]/database. Named instance: sqlsrv01\SQLEXPRESS/sis
    # (unquoted or single-quoted; double quotes need \\).
    url: sqlsrv01:1433/sis
    user: svc_report
    # Runs through the shell; the first line of stdout is the password.
    password_cmd: secret-tool lookup db sis
    options:                       # passed straight to pymssql.connect()
      encryption: require
      tds_version: "7.4"           # quote it, or YAML reads a number
      login_timeout: 15

  web:
    driver: mysql
    url: web-db:3306/webapp
    user: app_ro
    # No password or password_cmd: prompts on the terminal.
    # Or keep it in the OS keyring (install dprobe[keyring]): keyring: dprobe
    # and store it once with: dprobe keyring web
    # For MariaDB add: options: {collation: utf8mb4_general_ci}
