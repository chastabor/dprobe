# Throwaway databases for tests/test_integration.py:
#
#   docker compose -f tests/compose.yaml up -d --wait
#   DPROBE_IT_CONFIG=tests/it.example.yaml uv run pytest
#   docker compose -f tests/compose.yaml down
#
# The passwords are for these containers only, and the ports listen on 127.0.0.1.
# All four together need about 5 GB of memory; SQL Server alone wants 2 GB.
name: dprobe-it

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: probe_sys_pw
      APP_USER: prober
      APP_USER_PASSWORD: prober_pw
    ports: ["127.0.0.1:31521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"  # the free Developer edition, for testing only
      MSSQL_SA_PASSWORD: Probe-Pass-2026
    ports: ["127.0.0.1:31433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Probe-Pass-2026 -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  mysql:
    image: percona/percona-server:8.4
    environment:
      MYSQL_ROOT_PASSWORD: probe-root-pw
      MYSQL_DATABASE: probe
      MYSQL_USER: prober
      MYSQL_PASSWORD: prober-pw
    ports: ["127.0.0.1:33307:3306"]
    healthcheck:
      # Over TCP, which only opens once initialization is done.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uprober -pprober-pw"]
      interval: 5s
      timeout: 5s
      retries: 60

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: probe-root-pw
      MARIADB_DATABASE: probe
      MARIADB_USER: prober
      MARIADB_PASSWORD: prober-pw
    ports: ["127.0.0.1:33306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
